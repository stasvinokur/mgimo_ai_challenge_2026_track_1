[project]
name = "strategist"
version = "0.3.0"
description = "Стратег Фабрики проектов — ИИ-агент продуктовой и коммуникационной стратегии с проверяемыми основаниями"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "ollama>=0.4",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "trafilatura>=1.12",
    "sqlite-vec>=0.1.6",
    "markdown>=3.7",
    "mcp>=1.2",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "sse-starlette>=3.6",
    "python-multipart>=0.0.33",
]

[project.scripts]
strategist = "strategist.interfaces.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategist"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["cases/*/state", "evals/results"]

[tool.ruff.format]
# Скрипт IDE-хука защищён самим хуком (правка только с STRATEGIST_DEV=1), формат не навязываем.
exclude = ["scripts/hooks/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", # кириллица в строках — нормально для русскоязычного продукта
    "RUF002",
    "RUF003",
    "B008",   # typer.Option в значениях по умолчанию
    "E501",   # длину строк кода держит ruff format; длинные русские сообщения не переносим
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -m 'not live and not browser'"
markers = [
    "live: тесты с сетью и реальными моделями (запуск: uv run pytest -m live)",
    "browser: панель в браузере через Playwright (запуск: make ui-check)",
]
