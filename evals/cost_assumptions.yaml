# Допущения для полной стоимости решения брифа: API + минуты человека по ставке + переделки.
# Аналитика с лимитом времени на брифах стенда не прогоняли — по решению команды взяты средние значения
# из открытых источников (TASK-22). Машинное время и стоимость API берутся из меток времени прогонов
# (evals/results/<подход>/<бриф>/run.json).

analyst_minutes_per_task: 404
analyst_minutes_source: >-
  GDPval (arXiv 2510.04374, прил. A.2.1): «On average, on our 220 gold subset H_T=404 minutes» — среднее
  время, за которое отраслевой эксперт выполняет профессиональную задачу (самоотчёт, проверенный рецензентами).

review_minutes_per_deliverable: 109
review_minutes_source: >-
  GDPval (прил. A.2.1): «On average, RT=109 minutes» — среднее время, за которое эксперт проверяет результат
  модели (по данным мониторинга задач). Одинаково для чата и агента: данных, что реестр и самоаудит агента
  сокращают проверку, у нас нет.

agent_gate_minutes: 15
agent_gate_minutes_source: >-
  Допущение команды: четыре шлюза агента (уточнения, план и смета, выбор варианта, фиксация решения) —
  около 15 минут активного времени руководителя. На стенде шлюзы проходили автоответы, меток нет.

human_rate_rub_per_hour: 1220
human_rate_source: >-
  Хабр Карьера, «Зарплаты IT-специалистов в первой половине 2026 года: рост ниже инфляции», 21.07.2026
  (habr.com/ru/specials/1060148): медиана у аналитиков — 220 000 ₽ в Москве, 180 000 ₽ в Петербурге и
  160 000 ₽ в регионах. Берём 200 000 ₽ — середину между Москвой и Петербургом, где работают продуктовые
  команды крупных компаний; при 164 рабочих часах в месяц — ≈ 1 220 ₽/ч. Без страховых взносов работодателя —
  как и в GDPval, где ставка взята по медианной зарплате.

# Переделки по сценарию GDPval «Try 1x, then fix»: E[T] = машина + проверка + (1 − w) · время эксперта,
# где w — доля результатов, которые не надо переделывать.
redo_scenarios:
  optimistic:
    label: «оптимистичный» — w = доля брифов, где выбор совпал с ожидаемым экспертом полностью (прокси стенда)
  conservative:
    w: 0.39
    label: «консервативный» — w = 0,39, доля побед GPT-5 над экспертами в GDPval (табл. 2)
