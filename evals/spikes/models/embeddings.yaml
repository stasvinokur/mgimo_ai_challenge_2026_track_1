# 20 пар «запрос — фрагмент» на русском по теме кейса + 20 отвлекающих фрагментов (похожая лексика).
# Запросы — перефразы, а не копии фрагмента: проверяем смысловой поиск, а не совпадение слов.
# Данные условные (для теста), к реальным показателям отношения не имеют.
pairs:
  - query: Почему клиенты перестают платить за фильтр звонков?
    positive: "В отзывах чаще всего жалуются на ложные блокировки звонков от курьеров и банков: 41 из 120 отзывов."
  - query: Как изменилась доля тех, кто после пробного периода оформляет оплату
    positive: Конверсия пробного периода в платную подписку снизилась с 31% до 24% после запуска нового онбординга в июле.
  - query: Сколько стоит услуга и есть ли бесплатный период
    positive: Услуга стоит 99 рублей в месяц; первые 14 дней для впервые подключающих — без оплаты.
  - query: Нужен ли мобильный интернет для работы защиты
    positive: Фильтрация выполняется на стороне сети оператора, поэтому передача данных на смартфоне не требуется.
  - query: Какие альтернативы есть у пользователя бесплатно
    positive: Встроенные в смартфоны определители номера и бесплатные приложения конкурентов закрывают базовую задачу распознавания спама.
  - query: Когда можно будет добавить доверенные организации в исключения
    positive: Белый список верифицированных банков и курьерских служб находится в разработке, запуск запланирован на I квартал следующего года.
  - query: Что такое минимальный обнаруживаемый эффект в A/B-тесте
    positive: MDE — наименьшее изменение метрики, которое эксперимент с заданным размером выборки и мощностью способен надёжно отличить от шума.
  - query: Как разобрать возможные причины провала ещё до запуска
    positive: "Pre-mortem: команда представляет, что решение уже провалилось, и перечисляет причины, ранние сигналы и меры предотвращения."
  - query: Можно ли использовать ответы ИИ-собеседников как доказательство спроса
    positive: Ответы модельных респондентов годятся для поиска гипотез, но не доказывают спрос и распространённость потребности.
  - query: Как посчитать отток за месяц
    positive: Месячный отток равен числу ушедших за месяц платящих, делённому на число платящих на начало месяца.
  - query: Сколько платящих абонентов осталось к концу сентября
    positive: На конец сентября база платящих подписчиков составила 380 970 человек.
  - query: Что обещать в рекламе нельзя
    positive: Абсолютные формулировки вроде «блокирует 100% спама» или «звонки всегда дойдут» не подтверждены продуктом и исключены из коммуникации.
  - query: Что показывает история блокировок в приложении
    positive: В приложении видна история заблокированных звонков за последние 30 дней и приходит push-уведомление о каждой блокировке.
  - query: Кто принимает окончательное решение по услуге
    positive: Решение о судьбе направления принимает директор по цифровым продуктам на квартальном планировании.
  - query: Насколько точен фильтр спама
    positive: По внутренним тестам модель блокирует около 93% звонков с номеров из базы спамеров.
  - query: Что будет с базой, если ничего не менять
    positive: При сохранении текущей динамики к концу года база платящих сократится ещё на 8–10%.
  - query: Какие признаки говорят, что вариант пора остановить
    positive: "Kill-критерии: если через 8 недель отток не опустится ниже 3,8% или жалобы на пропущенный спам вырастут вдвое, вариант сворачиваем."
  - query: Как защититься от вредных команд в загруженных страницах
    positive: "Текст внешних источников считается данными: инструкции внутри него не выполняются, подозрительные фрагменты помечаются и изолируются."
  - query: Как изменятся расходы на доработки в следующем квартале
    positive: Бюджет на развитие продукта в следующем квартале, вероятно, сократят примерно на 30%.
  - query: Как часто пользователи жалуются на стоимость
    positive: На высокую цену указывают 18 из 120 отзывов в магазинах приложений.
distractors:
  - Отток абонентов мобильной связи по тарифу «Семейный» во II квартале остался на уровне 1,2%.
  - Конверсия посетителей лендинга в заявку на подключение домашнего интернета выросла до 6%.
  - Пробный период видеосервиса продлён до 30 дней для абонентов старших тарифов.
  - Для работы приложения-определителя номера требуется постоянное подключение к интернету.
  - Белый список сайтов в родительском контроле настраивается в личном кабинете.
  - Статистическая мощность эксперимента — вероятность обнаружить эффект, если он действительно есть.
  - Ретроспектива проводится после завершения проекта и разбирает, что пошло не так.
  - Глубинные интервью с реальными пользователями проводились по согласию и без персональных данных.
  - Выручка на пользователя (ARPU) считается как выручка за период, делённая на среднее число абонентов.
  - Число активных пользователей приложения в сентябре достигло 2,1 млн.
  - Рекламная кампания тарифа обещала безлимитный интернет на три месяца.
  - Push-уведомления о списаниях можно отключить в настройках приложения.
  - Бюджет маркетинга на IV квартал утверждён без изменений.
  - Точность распознавания речи голосового помощника составляет 95%.
  - Прогноз выручки направления на следующий год — рост на 12%.
  - Жалобы на качество связи в метро снизились после модернизации базовых станций.
  - Решение о запуске нового тарифа согласует коммерческий директор.
  - Модель машинного обучения обучена на обезличенных данных о звонках.
  - SMS-рассылка о новой функции получила открываемость 18%.
  - Средняя оценка приложения в магазине — 4,6 из 5.
