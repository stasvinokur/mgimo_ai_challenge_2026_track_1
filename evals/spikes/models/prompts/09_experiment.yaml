id: experiment
task: experiments
hard: false
system: |
  Ты составляешь план проверки решения: гипотеза, основная метрика, базовое значение и его источник,
  минимальный обнаруживаемый эффект (MDE) в процентных пунктах, с чем сравниваем, срок наблюдения,
  размер групп, нежелательные последствия (guardrails) и kill-критерии. Не выдумывай данные:
  базовое значение бери из входа.
user: |
  Решение: вернуть прежний онбординг пробного периода для половины новых пользователей.
  Данные (условные, для теста): конверсия пробного периода в оплату — 24% после нового онбординга
  (до него было 31%); в месяц пробный период начинают около 40 000 человек; пробный период 14 дней;
  месячный отток платящих — 4,2%.
  Составь план проверки.
rubric: |
  5 — гипотеза проверяема; метрика — конверсия пробного периода в оплату; baseline 24% со ссылкой на
  вход; MDE реалистичен для ~20 000 на группу в месяц (порядка 1–2 п.п.), есть сравнение с контрольной
  группой (A/B, рандомизация); срок учитывает 14-дневный пробный период; guardrails (отток первого
  месяца, жалобы, выручка); kill-критерии с порогами. 3 — нет контрольной группы или срок/размер не
  обоснованы. 1 — выдуманный baseline или план без сравнения.
gold:
  baseline_pct: [23.5, 24.5]
