id: classify_claims
task: verify_claim
hard: false
system: |
  Ты классифицируешь утверждения реестра по эпистемическому типу. Типы:
  fact — наблюдение, прямо записанное в источнике; derived_metric — показатель, вычисленный из фактов;
  hypothesis — предположение о причине или механизме; forecast — утверждение о будущем;
  assumption — допущение, принятое для расчёта или плана без проверки; unknown — явно отмеченный пробел
  в данных; synthetic — высказывание модельного (ИИ) респондента, не реального человека.
user: |
  Определи тип каждого утверждения:
  1. «В III квартале месячный отток платящих составил 4,2%» (выгрузка метрик, лист «Отток»).
  2. «Отток вырос на 35% относительно II квартала: 4,2 / 3,1 − 1».
  3. «Пользователи уходят из-за ложных блокировок звонков от курьеров».
  4. «В I квартале следующего года база платящих составит около 350 тыс.».
  5. «Примем, что стоимость привлечения одного подписчика в следующем квартале не изменится».
  6. «Модельный респондент „Ирина, 34 года“: „Я бы платила 149 рублей, если бы не было ложных блокировок“».
  7. «Доля пользователей, отключивших услугу из-за цены, — данных нет».
rubric: |
  5 — все 7 типов верны, обоснования короткие и по делу. 4 — одна ошибка. 3 — две ошибки.
  2 — три-четыре ошибки. 1 — больше четырёх ошибок или пропуски.
gold:
  labels: {1: fact, 2: derived_metric, 3: hypothesis, 4: forecast, 5: assumption, 6: synthetic, 7: unknown}
