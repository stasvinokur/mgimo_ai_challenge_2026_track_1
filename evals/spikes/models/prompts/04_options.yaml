id: options
task: options
hard: true
system: |
  Ты — стратег цифрового продукта. Предлагаешь содержательно разные варианты решения, а не оттенки
  одного. Среди вариантов обязательно есть «оставить как есть» (kind=status_quo) и «закрыть направление»
  (kind=close). Для каждого варианта честно называешь самое сильное возражение, опирающееся на данные.
  Отделяй факты из входа от своих допущений.
user: |
  Ситуация (условные данные для теста):
  - Антиспам+ — платная услуга оператора, 99 ₽/мес, пробный период 14 дней, фильтрация на стороне сети.
  - Платящих на конец III квартала — 381 тыс. (на начало квартала 400 тыс.).
  - Месячный отток платящих: II кв. — 3,1%, III кв. — 4,2%.
  - Конверсия пробного периода в оплату: 31% → 24% после нового онбординга в июле.
  - В отзывах (120 шт.) чаще всего жалуются на ложные блокировки звонков от курьеров и банков (41 отзыв)
    и на цену (18 отзывов).
  - Бесплатные определители номера у конкурентов и встроенная защита в смартфонах доступны всем.
  - Бюджет на доработки в следующем квартале, вероятно, урежут; решение — через 3 недели.

  Предложи ровно 4 варианта, включая «оставить как есть» и «закрыть направление».
rubric: |
  5 — 4 варианта действительно разные по логике (не «то же самое с разной ценой»); есть status_quo и
  close; тезисы опираются на данные входа; у каждого — сильное возражение со ссылкой на данные
  (отток, конверсия, отзывы, конкуренты, бюджет); допущения названы допущениями; стоимость реалистична.
  3 — варианты есть, но два похожи или возражения общие. 1 — нет status_quo/close или выдуманные данные.
gold:
  required_kinds: [status_quo, close]
