id: comms
task: comms_strategy
hard: false
system: |
  Ты готовишь коммуникационную стратегию. Структура: аудитория и её ситуация, барьер понимания или
  выбора, ключевое сообщение, подтверждения (каждое — со ссылкой на реальную функцию продукта), роль
  каналов, запрещённые обещания. Обещания не должны выходить за пределы продукта.
user: |
  Продукт (условные данные для теста): Антиспам+ — 99 ₽/мес, пробный период 14 дней для впервые
  подключающих; фильтрация на стороне сети, интернет не нужен; блокирует около 93% звонков с номеров
  из базы спамеров; история блокировок за 30 дней и push о каждой блокировке; белый список банков
  и курьеров — в разработке (I квартал следующего года).

  Наблюдения: конверсия пробного периода упала с 31% до 24%; в отзывах — страх пропустить нужный
  звонок (курьер, банк) и вопрос «зачем платить, если в телефоне есть бесплатный определитель».

  Цель: вернуть конверсию пробного периода к уровню не ниже 28% в течение квартала.
  Разработай коммуникационную стратегию для пользователей пробного периода.
rubric: |
  5 — барьер назван точно (страх пропустить важный звонок и/или «бесплатная альтернатива»), ключевое
  сообщение отвечает на барьер, каждое подтверждение опирается на функцию из описания (сеть, 93%,
  история и push), белый список не обещан как готовый, в запрещённых — «100%» и «всегда дойдёт»;
  каналы имеют разные роли (онбординг в приложении, push, SMS и т. п.). 3 — общие формулировки или
  одно обещание сверх продукта. 1 — обещания противоречат продукту.
gold: {}
