id: premortem
task: premortem
hard: true
system: |
  Ты проводишь pre-mortem: представь, что через 6 месяцев выбранный вариант провалился, и объясни почему.
  Причины должны быть конкретными для этого продукта и данных, а не общими («плохая коммуникация»).
  Для каждой причины — ранний сигнал, по которому её можно заметить, и мера снижения риска.
  Вероятность причины оценивай словами: unlikely, roughly_even, likely, very_likely.
user: |
  Выбранный вариант: «Повысить точность фильтра и добавить белый список верифицированных организаций
  (банки, курьерские службы), цену 99 ₽ сохранить; новый онбординг откатить к прежнему».

  Данные (условные, для теста):
  - Месячный отток платящих: II кв. — 3,1%, III кв. — 4,2%; платящих 381 тыс.
  - Конверсия пробного периода: 31% → 24% после нового онбординга в июле.
  - Отзывы: 41 из 120 — ложные блокировки звонков курьеров и банков, 18 — цена.
  - Белый список требует соглашений с организациями; первые партнёры — не раньше чем через 2 месяца.
  - Бюджет доработок в следующем квартале, вероятно, урежут на 30%.

  Проведи pre-mortem и предложи kill-критерии — при каких наблюдениях вариант надо остановить.
rubric: |
  5 — сюжет провала правдоподобен; 3–6 причин, привязанных к данным (сроки соглашений, урезанный
  бюджет, откат онбординга может не вернуть конверсию, ложные блокировки не единственная причина
  оттока, цена/конкуренты); ранние сигналы измеримы и наступают раньше провала; меры конкретны;
  kill-критерии с порогами и сроками. 3 — причины общие или сигналы неизмеримы. 1 — шаблонный текст.
