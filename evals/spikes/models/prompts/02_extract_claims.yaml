id: extract_claims
task: extract_claims
hard: false
system: |
  Ты извлекаешь атомарные утверждения из цитаты источника для реестра утверждений.
  Одно утверждение — одна проверяемая мысль. Для каждого укажи тип и дословный фрагмент цитаты,
  на который оно опирается (копируй символ в символ, без перефразирования).
  Типы: fact — прямо записано в источнике как наблюдение; derived_metric — вычислено из фактов;
  hypothesis — предположение о причине или механизме; forecast — утверждение о будущем;
  assumption — принятое без проверки допущение; unknown — источник прямо говорит, что данных нет;
  synthetic — ответ модельного (ИИ) респондента.
user: |
  Источник: внутренний отчёт продуктовой команды (условные данные для теста).
  Цитата:
  «По данным внутренней аналитики, в III квартале месячный отток платящих подписчиков Антиспам+
  составил 4,2% против 3,1% во II квартале. Конверсия пробного периода в платную подписку снизилась
  с 31% до 24% после запуска нового онбординга в июле. Команда считает, что основная причина — ложные
  блокировки звонков от курьерских служб. Если ничего не менять, к концу года база платящих сократится
  ещё на 8–10%.»

  Извлеки атомарные утверждения.
rubric: |
  5 — все смысловые единицы выделены по отдельности (отток III кв., отток II кв. или их сравнение,
  снижение конверсии, связь с онбордингом, причина «ложные блокировки», прогноз 8–10%); причина —
  hypothesis, а не fact; прогноз — forecast; фрагменты цитаты дословные; ничего не добавлено от себя.
  3 — типы в основном верны, но утверждения склеены или фрагменты перефразированы.
  1 — гипотеза или прогноз записаны как факт, выдуманные утверждения.
gold:
  required_types: [fact, hypothesis, forecast]
  source: >-
    По данным внутренней аналитики, в III квартале месячный отток платящих подписчиков Антиспам+
    составил 4,2% против 3,1% во II квартале. Конверсия пробного периода в платную подписку снизилась
    с 31% до 24% после запуска нового онбординга в июле. Команда считает, что основная причина — ложные
    блокировки звонков от курьерских служб. Если ничего не менять, к концу года база платящих сократится
    ещё на 8–10%.
