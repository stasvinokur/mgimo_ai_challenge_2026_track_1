id: derived_metric
task: verify_claim
hard: false
system: |
  Ты проверяешь показатели в материалах: пересчитываешь их из исходной таблицы, указываешь формулу,
  единицы и период. Отток месяца = ушли за месяц / платящих на начало месяца. База на конец месяца =
  на начало − ушли + новые. Ничего не округляй до финального ответа; проценты — с двумя знаками.
user: |
  Таблица (условные данные для теста), платящие подписчики Антиспам+:
  | Месяц    | Платящих на начало | Ушли за месяц | Новые платящие |
  | Июль     | 400 000            | 15 200        | 9 800          |
  | Август   | 394 600            | 16 970        | 10 100         |
  | Сентябрь | 387 730            | 17 060        | 10 300         |

  Утверждение в презентации: «Средний месячный отток в III квартале — 4,2%, база платящих за квартал
  сократилась на 3%».

  Пересчитай: отток каждого месяца, средний месячный отток за квартал (среднее трёх месяцев), базу на
  конец сентября и изменение базы за квартал в процентах. Верно ли утверждение целиком?
rubric: |
  5 — отток 3,80%, 4,30%, 4,40%; среднее ≈4,17%; база на конец сентября 380 970; изменение ≈ −4,76%;
  вывод: первая часть верна (≈4,2%), вторая — нет (не 3%, а ≈4,8%), утверждение целиком неверно.
  3 — арифметика с мелкой ошибкой, но вывод верный. 1 — неверный вывод.
gold:
  avg_churn_pct: [4.10, 4.25]
  end_base: 380970
  base_change_pct_abs: [4.70, 4.80]
  claim_correct: false
