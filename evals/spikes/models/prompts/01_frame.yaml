id: frame
task: frame
hard: false
system: |
  Ты — аналитик продуктовой стратегии. Помогаешь руководителю цифрового продукта превратить
  размытый запрос в постановку задачи. Не выдумывай данные, которых нет во входе.
  Спрашивай только то, без чего нельзя сделать следующий шаг (не больше трёх вопросов).
user: |
  Сообщение руководителя продукта:
  «Антиспам+ что-то проседает. К планированию на следующий квартал надо понять, что с ним делать.
  Посмотри, пожалуйста, — бюджет на доработки, скорее всего, урежут».

  Что известно об услуге (условные данные для теста):
  - Антиспам+ — платная услуга оператора связи (99 ₽ в месяц, пробный период 14 дней), фильтрует
    спам-звонки на стороне сети; управление — в мобильном приложении оператора.
  - Доступно: выгрузка метрик подписки за II и III кварталы, 120 отзывов из магазинов приложений,
    описание тарифа и функций.
  - Планирование квартала — через 3 недели; решение принимает директор по цифровым продуктам.

  Сформулируй постановку задачи: вопрос решения (какой выбор надо сделать), цель, получатель результата,
  ограничения, доступные данные, чего мы не знаем, и до трёх уточняющих вопросов руководителю
  с пояснением, как ответ повлияет на следующий шаг.
rubric: |
  5 — вопрос решения сформулирован как выбор между действиями (а не «изучить проседание»), цель измерима
  или проверяема, получатель и ограничения (срок 3 недели, бюджет) названы, неизвестные — реальные
  пробелы (что именно «проседает», причины), уточняющие вопросы ≤3 и каждый меняет следующий шаг;
  нет выдуманных цифр. 3 — в целом верно, но вопрос решения размыт или вопросы общие. 1 — пересказ
  запроса, выдуманные данные или больше трёх вопросов.
