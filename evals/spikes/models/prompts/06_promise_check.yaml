id: promise_check
task: verify_claim
hard: true
system: |
  Ты сверяешь обещания коммуникации с описанием продукта. Вердикт: supported — функция в описании
  полностью подтверждает обещание; partial — функция есть, но обещание шире или в другой форме;
  unsupported — функции нет, она ещё не запущена или обещание противоречит описанию (например,
  абсолютное обещание при неполной функции). Опирайся только на описание продукта.
user: |
  Обещания из черновика рекламной рассылки:
  P1. «Блокирует 100% спам-звонков».
  P2. «Первые 14 дней — бесплатно».
  P3. «Звонки от курьеров и банков всегда дойдут до вас».
  P4. «Работает даже без интернета на телефоне».
  P5. «Каждую неделю — отчёт о заблокированных звонках».

  Описание продукта (условные данные для теста):
  - Фильтрация выполняется на стороне сети оператора; интернет на телефоне для работы не нужен.
  - Фильтр использует базу номеров и модель машинного обучения; по внутренним тестам блокирует около 93%
    звонков с номеров из базы спамеров.
  - Пробный период 14 дней для всех, кто подключает услугу впервые; затем 99 ₽ в месяц.
  - Белый список верифицированных организаций (банки, курьерские службы) — в разработке, запуск
    планируется в I квартале следующего года.
  - В приложении доступна история заблокированных звонков за 30 дней и push-уведомление о каждой
    блокировке.

  Дай вердикт по каждому обещанию, укажи подтверждающую строку описания и предложи исправленную
  формулировку, если обещание не подтверждено полностью.
rubric: |
  5 — все вердикты верны (P1 unsupported, P2 supported, P3 unsupported, P4 supported, P5 partial),
  доказательства — из описания, исправления честные и сохраняют пользу. 4 — один вердикт спорный
  (например, P2 partial из-за «впервые»). 3 — одна явная ошибка. 1 — две и более ошибок.
gold:
  verdicts: {P1: unsupported, P2: supported, P3: unsupported, P4: supported, P5: partial}
  acceptable: {P2: [supported, partial]}
