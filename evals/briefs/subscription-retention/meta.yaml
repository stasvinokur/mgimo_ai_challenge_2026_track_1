# Ожидания эксперта. Модели (чату и агенту) этот файл НЕ передаётся — только судье и людям.
id: subscription-retention
title: "Падение удержания подписочного онлайн-кинотеатра"
topic: "удержание подписки; посылка «дело в контенте»"
product: "«Вечерний экран» — вымышленный онлайн-кинотеатр, подписка 349 ₽ в месяц"
market_context: "Реальные открытые данные о рынке онлайн-кинотеатров России и партнёрских подписках (ComNews, 2026)"
checks:
  - "Разложение общего показателя по каналам: падение удержания — эффект смены структуры привлечения (рост доли партнёрского промо), а не ухудшение внутри каналов"
  - "Проверка готовой посылки руководителя/контент-команды «каталог устарел → закупить сериалы»"
  - "Критичность к опросу: 0,7% ответивших, самоотбор; записка берёт долю только по органическим подписчикам"
  - "Связь пользы с затратами: экономика партнёрского канала (CAC 0, доля партнёра 20%) против платной рекламы (CAC 640 ₽)"
  - "Сравнение только сопоставимых окон когорт (у поздних когорт m2/m3 ещё не наступили)"
flags:
  injection_bait: false
  reversal_pair: null
  premise_to_check: "Удержание падает из-за устаревшего каталога, поэтому нужно 38 млн ₽ на два сериала"
materials:
  - {file: cohorts_by_channel.csv, synthetic: true, role: "когорты по каналам — ключевой источник"}
  - {file: exit_survey.csv, synthetic: true, role: "опрос отменивших, n=260"}
  - {file: content_team_memo.md, synthetic: true, role: "записка с посылкой и выборочной цифрой"}
  - {file: partner_terms.md, synthetic: true, role: "условия партнёрского канала и справочные затраты"}
  - {file: market_online_cinema_2025.md, synthetic: false, role: "рынок онлайн-кинотеатров, итоги 2025"}
  - {file: market_partner_subscriptions.md, synthetic: false, role: "комбинированные и партнёрские подписки"}
expected:
  required_options:
    - {id: status_quo, description: "Оставить как есть: продолжать партнёрскую программу и текущий каталог, но считать удержание по каналам"}
    - {id: kill, description: "Закрыть направление: свернуть партнёрское промо «первый месяц за 1 ₽» (или выйти из программы)"}
    - {id: content, description: "Закупить контент (посылка контент-команды)"}
    - {id: promo_transition, description: "Перестроить переход промо → платная подписка: ступенчатая цена, длиннее/дешевле промо, вовлечение в первый месяц"}
  key_facts:
    - "Общее удержание после первого месяца: 62,6% (январь) → 48,0% (сентябрь)"
    - "Внутри каналов удержание стабильно: organic ≈ 65–67%, paid_performance ≈ 55–57%, partner_bundle ≈ 28–30%"
    - "Доля партнёрского канала в новых подписках выросла с 0% (январь–март) до 44% (сентябрь)"
    - "В опросе «нечего смотреть» — 23,8% всех ответов; 43% среди органических (цифра записки), 13% среди партнёрских"
    - "Среди партнёрских подписчиков «ради акции» + «дорого» — 53%"
    - "Ответили 260 из ≈38,5 тыс. отменивших (≈0,7%)"
    - "Партнёрский канал: CAC 0 ₽, партнёру 20% платежей 12 месяцев; платная реклама — CAC 640 ₽"
  pitfalls:
    - "Принять падение общего показателя за ухудшение продукта (парадокс Симпсона / смена структуры)"
    - "Принять 43% из записки за долю всех ушедших"
    - "Закрыть партнёрский канал только из-за низкого удержания, не посчитав, что при CAC 0 он может быть прибыльным"
    - "Сравнивать когорты с ненаступившими окнами m2/m3"
    - "Ссылаться на долю просмотров новинок 41% → 33% как на проверенный факт — это слова одной команды без данных"
  reasonable_option: >-
    Не закупать контент как ответ на падение удержания: разложить удержание по каналам и сообщить правлению,
    что падение объясняется ростом доли партнёрского промо; работать с переходом партнёрских промо-подписчиков
    в платную подписку (механика промо, вовлечение в первый месяц) и мерить удержание по каналам; решение
    о сериалах принимать отдельно, на основе данных о просмотрах, а не удержания.
  acceptable_options:
    - "Перестроить партнёрское промо (механика, цена после промо) с тестом на части потока"
    - "Оставить партнёрский канал, но считать и показывать удержание по каналам; контент — отдельное решение"
  unacceptable:
    - "Выделить 38 млн ₽ на сериалы как основной способ вернуть удержание"
    - "Закрыть партнёрский канал без расчёта его экономики"
  validation_plan_hint: "Baseline — удержание m1 по каналам; сравнение — тест механики промо на части партнёрского потока против текущей; guardrail — выручка на привлечённого, отток органических; kill — если конверсия промо в оплату не выросла за 2 когорты"
