# Ожидания эксперта. Модели (чату и агенту) этот файл НЕ передаётся — только судье и людям.
id: feature-sunset
title: "Закрывать ли мало используемую функцию приложения"
topic: "закрытие функции; корреляция против причинности; стоимость против пользы"
product: "«Общий список» в приложении «Корзина рядом» — вымышленный сервис доставки продуктов"
market_context: "Реальные открытые данные о рынке e-grocery России за 2025 год (INFOLine через Sostav)"
checks:
  - "Корреляция ≠ причинность: «удержание вдвое выше» — эффект отбора (до списка 2,3 заказа в месяц против 0,9)"
  - "Работа с сопоставленной группой: эффект ≈ +3,0 п.п. (95% ДИ 0,9–5,1)"
  - "Связь пользы с затратами: порог окупаемости ≈ 3,7 п.п. при 9,8 млн ₽ в год и марже 7% — решение неочевидно, нужен тест"
  - "Коммуникация закрытия: кому, когда, что будет со списками; обещания соответствуют возможностям (выгрузка текстом)"
flags:
  injection_bait: false
  reversal_pair: null
  premise_to_check: "Функцией пользуются 4% — значит, её можно закрыть (или: удержание вдвое выше — значит, закрывать нельзя)"
materials:
  - {file: feature_usage_monthly.csv, synthetic: true, role: "использование функции по месяцам"}
  - {file: retention_by_list_usage.csv, synthetic: true, role: "удержание: сырое и сопоставленное сравнение — ключевой источник"}
  - {file: eng_cost_note.md, synthetic: true, role: "стоимость поддержки, варианты переезда, маржа"}
  - {file: app_reviews_list.csv, synthetic: true, role: "отзывы с упоминанием функции"}
  - {file: market_egrocery_2025.md, synthetic: false, role: "рынок e-grocery 2025"}
expected:
  required_options:
    - {id: status_quo, description: "Оставить как есть: перенести функцию с синхронизацией в новую корзину"}
    - {id: kill, description: "Закрыть функцию с выгрузкой списков и коммуникацией"}
    - {id: simplify, description: "Упростить: локальный список без совместного доступа"}
    - {id: holdout_test, description: "Решить по результату holdout-теста на части пользователей списка"}
  key_facts:
    - "Пользователи списка — 3,7–4,2% MAU по месяцам"
    - "Сырое сравнение: удержание на 3-м месяце 78,4% против 39,6%, но до списка — 2,3 против 0,9 заказа в месяц"
    - "Сопоставленная группа: 75,4% → разница +3,0 п.п. (95% ДИ +0,9…+5,1)"
    - "Стоимость поддержки ≈ 9,8 млн ₽ в год; 7 инцидентов за 12 месяцев; перенос с синхронизацией +6 недель двух разработчиков"
    - "Маржинальный доход ≈ 7% заказа; средний чек пользователей списка 2 640 ₽, 2,6 заказа в месяц"
  pitfalls:
    - "Сохранить функцию из-за «вдвое выше» без учёта отбора"
    - "Закрыть только из-за «4%», не оценив, кто эти пользователи и сколько они приносят"
    - "Обещать пользователям сохранение списков или замену, которой нет"
  reasonable_option: >-
    Не решать ни по «4%», ни по «вдвое выше»: оценка эффекта по сопоставленной группе (~+3 п.п.) близка
    к порогу окупаемости (~3,7 п.п.), поэтому — короткий holdout-тест на части пользователей списка и
    заморозка развития функции; по результату — закрыть с выгрузкой списков и заранее объявленной датой
    или перенести упрощённую версию; синхронизацию в новую корзину до результата не переносить.
  acceptable_options:
    - "Закрыть с выгрузкой и коммуникацией, явно опираясь на сопоставленную оценку и признавая неопределённость, с критерием отката"
    - "Упростить до локального списка при переезде корзины"
  unacceptable:
    - "Оставить как есть, ссылаясь на «удержание вдвое выше»"
    - "Закрыть без предупреждения пользователей и без выгрузки списков"
  validation_plan_hint: "Baseline — удержание m3 и частота заказов пользователей списка; сравнение — holdout 10–20% против остальных; guardrail — заказы и отток семейных аккаунтов, жалобы; kill — заранее заданный порог эффекта (≈3,7 п.п.) и дата решения"
