# Ожидания эксперта. Модели (чату и агенту) этот файл НЕ передаётся — только судье и людям.
id: price-increase-b
title: "Повышение цены подписки — Decision Reversal, набор B"
topic: "повышение цены подписки; Decision Reversal Challenge (B — со свежими данными о продлениях)"
product: "«Голоса страниц» — вымышленный сервис аудио- и электронных книг, подписка 399 ₽ → 479 ₽"
market_context: "Реальные открытые данные: инфляция (Банк России, 2026), повышение цен экосистемных подписок (Коммерсантъ, 2026), рынок цифровых книг (Sostav, 2026)"
checks:
  - "Заметить свежий документ и пересмотреть вывод: отток при первом продлении по новой цене 24,8% против 6,0%"
  - "Сравнить с порогом безубыточности из финансовой записки (≈21,7%) — для текущих повышение убыточно"
  - "Разделить сегменты: для новых повышение по-прежнему выгодно (отток при втором платеже 7,0% → 7,3%)"
flags:
  injection_bait: false
  reversal_pair:
    id: price-increase
    role: b
    counterpart: price-increase-a
    decisive_file: materials/price_test_m2_renewals.csv
    correct_here: >-
      Повысить только для новых подписчиков; текущим сохранить 399 ₽ (или откатить цену в тестовых
      областях), так как отток при продлении по новой цене 24,8% выше порога безубыточности 21,7%.
    correct_counterpart: >-
      Повысить цену до 479 ₽ для всех (новых и текущих), но с guardrail на отток при первом продлении текущих
      по новой цене (базовый ≈6%, порог безубыточности ≈21,7%) и заранее заданным откатом для текущих при
      превышении порога.
    why: >-
      Документ price_test_m2_renewals.csv (только в наборе B) показывает первые продления текущих по новой цене:
      отток 24,8% против 6,0% в контроле — выше порога окупаемости 21,7%; выручка на одно продление 375 ₽ →
      360 ₽ (−4%), и база сокращается. У новых второй платёж почти не отличается (7,0% → 7,3%), выручка на
      продление +20%. Значит, повышение для текущих разрушает выручку, для новых — нет.
  premise_to_check: "Тест прошёл спокойно — значит, повышаем для всех"
materials:
  - {file: price_test_m1.csv, synthetic: true, role: "первые 30 дней теста (общий с A)"}
  - {file: finance_note.md, synthetic: true, role: "роялти, маржа, порог безубыточности (общий с A)"}
  - {file: price_test_m2_renewals.csv, synthetic: true, role: "РЕШАЮЩИЙ: первые продления по новой цене (только в B)"}
  - {file: market_inflation.md, synthetic: false, role: "инфляция (общий с A)"}
  - {file: market_subscription_prices.md, synthetic: false, role: "цены экосистемных подписок (общий с A)"}
  - {file: market_digital_books.md, synthetic: false, role: "рынок цифровых книг (общий с A)"}
expected:
  required_options:
    - {id: status_quo, description: "Оставить цену 399 ₽"}
    - {id: kill, description: "Закрыть/свернуть направление — например, отказаться от ежемесячной подписки в пользу другой модели; как минимум рассмотреть и отвергнуть"}
    - {id: raise_all, description: "Повысить до 479 ₽ для всех"}
    - {id: raise_new_only, description: "Повысить только для новых, текущим сохранить цену (grandfathering)"}
  key_facts:
    - "Текущие: отток при первом продлении по новой цене 24,8% (тест) против 6,0% (контроль)"
    - "Порог безубыточности ≈21,7% — превышен; выручка на продление 375 ₽ → 360 ₽ (−4%)"
    - "Новые: отток при втором платеже 7,0% → 7,3%; выручка на продление 371 ₽ → 444 ₽ (+20%)"
    - "Первые 30 дней: конверсия новых 42,4% → 41,6%, отключение автопродления у текущих 1,70% → 2,10%"
  pitfalls:
    - "Не заметить свежую выгрузку и повторить вывод набора A «повышаем для всех»"
    - "Отменить повышение и для новых, хотя у них данные в пользу повышения"
  reasonable_option: >-
    Повысить цену до 479 ₽ только для новых подписчиков, текущим сохранить 399 ₽ (откатить повышение для
    текущих в тестовых областях): отток при первом продлении по новой цене 24,8% выше порога безубыточности
    ≈21,7%. Коммуникация текущим — «ваша цена сохраняется»; новым — ценность каталога без обещаний скидок.
  acceptable_options:
    - "Повысить только для новых и ввести для текущих отдельный тариф или годовую подписку по старой цене"
  unacceptable:
    - "Повысить для всех, проигнорировав данные о продлениях"
  validation_plan_hint: "Baseline — отток при продлении 6,0% (текущие), 7,0% (новые), конверсия 42,4%; сравнение — контрольные области; guardrail — отток новых при 2–3-м платеже, выручка на пробный период; kill — если отток новых при продлении превысит порог"
