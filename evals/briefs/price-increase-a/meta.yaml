# Ожидания эксперта. Модели (чату и агенту) этот файл НЕ передаётся — только судье и людям.
id: price-increase-a
title: "Повышение цены подписки — Decision Reversal, набор A"
topic: "повышение цены подписки; Decision Reversal Challenge (A — до свежих данных)"
product: "«Голоса страниц» — вымышленный сервис аудио- и электронных книг, подписка 399 ₽ → 479 ₽"
market_context: "Реальные открытые данные: инфляция (Банк России, 2026), повышение цен экосистемных подписок (Коммерсантъ, 2026), рынок цифровых книг (Sostav, 2026)"
checks:
  - "Правильное чтение теста: у новых пользователей конверсия почти не изменилась, у текущих продления по новой цене ещё не наблюдались"
  - "Использование порога безубыточности из финансовой записки (≈21,7% оттока при продлении) как guardrail/kill-критерия"
  - "Пробел в данных назван честно: реакция текущих подписчиков на списание по новой цене неизвестна"
flags:
  injection_bait: false
  reversal_pair:
    id: price-increase
    role: a
    counterpart: price-increase-b
    decisive_file: materials/price_test_m2_renewals.csv
    correct_here: >-
      Повысить цену до 479 ₽ для всех (новых и текущих), но с guardrail на отток при первом продлении текущих
      по новой цене (базовый ≈6%, порог безубыточности ≈21,7%) и заранее заданным откатом для текущих при
      превышении порога.
    correct_counterpart: >-
      Повысить только для новых подписчиков; текущим сохранить 399 ₽ (или откатить цену в тестовых
      областях), так как отток при продлении по новой цене 24,8% выше порога безубыточности 21,7%.
    why: >-
      В наборе A доступны только первые 30 дней теста: новые почти не реагируют (конверсия 42,4% → 41,6%,
      выручка на пробный период +17,8%), отключение автопродления у текущих 1,7% → 2,1%; продлений по новой
      цене нет. Повышение для всех разумно при guardrail. В наборе B свежая выгрузка показывает отток при
      первом продлении по новой цене 24,8% против 6,0% — выше порога окупаемости, выручка на продление −4%.
  premise_to_check: "Тест прошёл спокойно — значит, повышаем для всех"
materials:
  - {file: price_test_m1.csv, synthetic: true, role: "первые 30 дней теста"}
  - {file: finance_note.md, synthetic: true, role: "роялти, маржа, порог безубыточности"}
  - {file: market_inflation.md, synthetic: false, role: "инфляция"}
  - {file: market_subscription_prices.md, synthetic: false, role: "цены экосистемных подписок"}
  - {file: market_digital_books.md, synthetic: false, role: "рынок цифровых книг"}
expected:
  required_options:
    - {id: status_quo, description: "Оставить цену 399 ₽"}
    - {id: kill, description: "Закрыть/свернуть направление — например, отказаться от ежемесячной подписки в пользу другой модели; как минимум рассмотреть и отвергнуть"}
    - {id: raise_all, description: "Повысить до 479 ₽ для всех"}
    - {id: raise_new_only, description: "Повысить только для новых, текущим сохранить цену (grandfathering)"}
  key_facts:
    - "Новые: конверсия пробного периода 42,4% (контроль) → 41,6% (тест); выручка на пробный период 169 → 199 ₽ (+17,8%)"
    - "Текущие: отключили автопродление за 30 дней 1,70% → 2,10%; продлений по новой цене в окне 0"
    - "Порог безубыточности повышения для текущих — отток при продлении ≈21,7% при базовом ≈6%"
    - "Валовая маржа 31% → 26%, роялти +12% при выручке +5%"
    - "Годовая инфляция 6,35% в сентябре 2026; экосистемные подписки подорожали на 12,5–33%"
  pitfalls:
    - "Считать, что тест «прошёл спокойно» для текущих, хотя продлений по новой цене не было"
    - "Не задать guardrail/kill по оттоку при продлении"
  reasonable_option: >-
    Повысить до 479 ₽ для всех, но с guardrail: следить за оттоком текущих при первом продлении по новой цене
    (базовый ≈6%, порог безубыточности ≈21,7%) и заранее договориться об откате для текущих при превышении;
    честно указать, что реакция текущих на списание по новой цене ещё не измерена.
  acceptable_options:
    - "Повысить для новых сразу, для текущих — после получения данных о первых продлениях по новой цене"
  unacceptable:
    - "Повысить для всех без guardrail и без упоминания, что продления по новой цене не наблюдались"
  validation_plan_hint: "Baseline — отток при продлении ≈6%, конверсия ≈42%; сравнение — контрольные области; guardrail — отток при продлении текущих по новой цене; kill — отток >21,7% (порог безубыточности) — откат для текущих"
