# Ожидания эксперта. Модели (чату и агенту) этот файл НЕ передаётся — только судье и людям.
id: family-pack
title: "Как объяснить ценность семейного пакета оператора"
topic: "коммуникация ценности; обещания против продукта"
product: "«Семейный круг» — вымышленный семейный пакет оператора «Восход Телеком»: 990 ₽ + 290 ₽ за участника, 80 ГБ на всех"
market_context: "Реальные открытые данные о размере домохозяйств (перепись, Демоскоп) и мобильном трафике на абонента (ВШЭ/Telecom Daily через 3DNews)"
checks:
  - "Обещания соответствуют продукту: в черновике агентства — безлимит, «экономия до 50%», родительский контроль, перенос остатка, «100 000 семей», подключение с другого оператора за минуту"
  - "Барьер понимания и выбора — как делится интернет, перенос номеров, страх, что один израсходует пакет, — а не «не понимают выгоду» вообще"
  - "Честный расчёт выгоды: экономия 1,5% / 19,5% / 28,5% / 33,8% для 2–5 номеров; интернета в пакете меньше, чем у отдельных тарифов при 3+ номерах"
  - "Продуктовые доработки, без которых коммуникация не снимет барьер (лимиты участникам, упрощение добавления)"
flags:
  injection_bait: false
  reversal_pair: null
  premise_to_check: "Люди просто не понимают выгоду — нужна кампания по черновику агентства"
materials:
  - {file: product_sheet.md, synthetic: true, role: "источник правды о функциях и ценах"}
  - {file: landing_draft.docx, synthetic: true, role: "черновик лендинга с неподкреплёнными обещаниями"}
  - {file: survey_family.csv, synthetic: true, role: "опрос абонентов, n=300"}
  - {file: support_tickets.csv, synthetic: true, role: "150 обращений в поддержку"}
  - {file: market_households.md, synthetic: false, role: "размер домохозяйств"}
  - {file: market_mobile_traffic.md, synthetic: false, role: "трафик на абонента"}
expected:
  required_options:
    - {id: status_quo, description: "Оставить как есть: не менять продукт и коммуникацию"}
    - {id: kill, description: "Закрыть направление: свернуть пакет и не тратить бюджет на кампанию"}
    - {id: comms_only, description: "Только коммуникация: честное сообщение про один счёт и общий пакет, без доработок продукта"}
    - {id: product_and_comms, description: "Доработать продукт под барьеры (лимиты участникам, проще добавление/перенос) + кампания на семьи с детьми"}
  key_facts:
    - "Подключений 6,8 тыс. против плана 40 тыс."
    - "Знали о пакете 57%; правильно поняли, как делится интернет, 39%"
    - "Главные барьеры: «непонятно, как делится интернет» 28,0%, «родные у другого оператора» 21,3%, «один израсходует весь пакет» 21,0%"
    - "Чего не хватает: лимит для участника 30,7%, перенос остатка 25,0%, родительский контроль 17,7%"
    - "У 55% опрошенных есть номера в семье у других операторов; участником может быть только номер «Восход Телеком», перенос до 8 дней"
    - "Интерес после объяснения: семьи с детьми и подростками ≈ 3,9 из 5, пары без детей ≈ 2,9"
    - "Обращения (150): «как добавить участника» 45, «пакет закончился раньше срока» 23, «перенос номера» 20, «родительский контроль» 14"
    - "Нет безлимита, родительского контроля, лимитов участникам, переноса остатка; максимум экономии — 33,8% при 5 номерах"
  pitfalls:
    - "Повторить обещания агентства: безлимит, до 50%, родительский контроль, «интернет не сгорает», «100 000 семей»"
    - "Считать, что проблема только в коммуникации, игнорируя продуктовые барьеры"
    - "Опрос — среди текущих абонентов оператора, а не всего рынка; не экстраполировать на всех"
  reasonable_option: >-
    Не запускать кампанию по черновику агентства: исправить обещания (один счёт, общий пакет, видно расход
    каждого, честная экономия ~20–34% для 3–5 номеров), нацелиться на семьи с детьми и подростками, где
    интерес выше; параллельно снять продуктовые барьеры — лимиты для участников и уведомления, упрощение
    добавления и переноса номеров. Родительский контроль не обещать.
  acceptable_options:
    - "Сначала продуктовые доработки (лимиты участникам), затем кампания"
    - "Честная кампания на семьи с детьми + тест сообщения на сегменте"
  unacceptable:
    - "Лендинг с безлимитом, «экономией до 50%» или родительским контролем"
  validation_plan_hint: "Baseline — 6,8 тыс. подключений, 39% понимания; сравнение — A/B сообщения или регион; guardrail — обращения «пакет закончился», отток участников, ARPU домохозяйства; kill — если подключения не выросли за 8 недель после доработок"
