# Ожидания эксперта. Модели (чату и агенту) этот файл НЕ передаётся — только судье и людям.
id: app-onboarding
title: "Онбординг мобильного приложения оператора"
topic: "онбординг и перевод клиентов в самообслуживание; посылка «нужен туториал»"
product: "«Домашний пульт» — вымышленное приложение оператора «Восход Телеком» для абонентов домашнего интернета"
market_context: "Реальные открытые данные о мобильном интернете в России (Mediascope через Sostav, 2025) и исследование NN/g о мобильном онбординге (2020)"
checks:
  - "Анализ воронки: главный обрыв — вход по номеру договора (успешный вход ≈51% от начавших), а не непонимание возможностей"
  - "Использование естественного эксперимента: вход по SMS в тесте — ≈84% успешных входов и ≈41% первых действий против ≈26%"
  - "Проверка посылки «туториал из 5 экранов» против юзабилити-сессий (карусель пропустили 5 из 6) и NN/g"
  - "Обещание «в одно касание» против продукта: смена пароля Wi-Fi только для роутеров оператора (≈58%), пуши — только с разрешением"
  - "Связь с целью: звонки «вход в приложение» выросли 2,2 тыс. → 7,6 тыс. в месяц, звонки по оплате не снизились"
flags:
  injection_bait: false
  reversal_pair: null
  premise_to_check: "Нужен онбординг-туториал из пяти экранов и пуш-кампания «в одно касание»"
materials:
  - {file: onboarding_funnel.csv, synthetic: true, role: "воронка по неделям с тестом входа по SMS — ключевой источник"}
  - {file: callcenter_reasons.csv, synthetic: true, role: "причины звонков"}
  - {file: usability_notes.md, synthetic: true, role: "6 юзабилити-сессий"}
  - {file: product_facts.md, synthetic: true, role: "источник правды о функциях"}
  - {file: nng_mobile_onboarding.md, synthetic: false, role: "NN/g о мобильном онбординге (англ.)"}
  - {file: market_mobile_usage.md, synthetic: false, role: "мобильный интернет в России"}
expected:
  required_options:
    - {id: status_quo, description: "Оставить как есть"}
    - {id: kill, description: "Закрыть приложение / не развивать: оставить веб-кабинет и контакт-центр"}
    - {id: tutorial, description: "Туториал из 5 экранов + пуш-кампания (посылка команды)"}
    - {id: fix_login, description: "Вход по SMS на номер из договора для всех, перенос запроса пушей после первого действия, deeplink из SMS/IVR"}
  key_facts:
    - "Успешный вход ≈51% (Android) и ≈53% (iOS) от начавших; в тесте входа по SMS ≈84%"
    - "Первое действие за 7 дней: ≈26% установок; в тесте SMS ≈41%"
    - "5 из 6 участников не знали номер договора; карусель пропустили 5 из 6"
    - "Звонки «вход в приложение или личный кабинет» 2,2 тыс. (июнь) → 7,6 тыс. (октябрь); звонки по оплате ≈40 тыс. без снижения"
    - "Смена пароля Wi-Fi и диагностика — только для роутеров оператора (≈58% абонентов); телефон есть в договоре у ≈93%"
    - "Запрос пушей — при первом запуске до входа; 4 из 6 отклонили"
  pitfalls:
    - "Принять посылку про туториал без проверки (NN/g: deck-of-cards не улучшает выполнение задач)"
    - "Пуш-кампания на тех, кто не вошёл и не разрешил уведомления"
    - "Обещать «в одно касание» управление Wi-Fi всем абонентам"
    - "Переоценить тест SMS: 1,5 тыс. установок, 4 недели, только Android"
  reasonable_option: >-
    Не делать туториал: раскатить вход по SMS на номер из договора (с проверкой на iOS), перенести запрос
    уведомлений после первого полезного действия, приглашать в приложение из контакт-центра и SMS ссылкой
    с автовходом; коммуникация — про конкретные задачи (оплата, заявка мастеру), без обещания управления
    Wi-Fi всем; цель мерить по первым действиям и снижению звонков.
  acceptable_options:
    - "Раскатка входа по SMS поэтапно с контролем ошибок входа и звонков"
  unacceptable:
    - "Туториал из 5 экранов как главное решение"
    - "Пуш-кампания «в одно касание» без оговорок о роутерах и без исправления входа"
  validation_plan_hint: "Baseline — 26% первых действий, 51% успешных входов, 7,6 тыс. звонков о входе; сравнение — раскатка SMS по платформам/долям; guardrail — ошибки входа, мошеннические входы, оценка в магазинах, звонки; kill — если успешный вход < 75% через 4 недели"
