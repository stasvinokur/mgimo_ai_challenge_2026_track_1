note: "СИНТЕТИКА: продукт и ответы вымышлены, персональных данных нет. Одна строка — один ответ. Опрос показывается при отключении в приложении; тем, кто приложение не устанавливал, приходит SMS со ссылкой (отвечают реже). Поля channel, child_age_group, child_platform, paired_child_device, paid_months_before_cancel и location_days_last_30 (дней с полученной геолокацией ребёнка за последние 30 дней перед отключением) подтянуты из продуктовой аналитики; main_reason — один закрытый вариант ответа; nps_0_10 — готовность рекомендовать. child_platform известна только для подключивших телефон ребёнка."
